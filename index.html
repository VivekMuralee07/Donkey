<html lang="en"><head><meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="icon" href="/icon.svg">
<title>Donkey</title>
<style>
:root{--bg:#07140f;--felt:#17804c;--felt2:#0a4a2b;--ink:#f6f2e7;--mut:#9fc2ae;--gold:#f5c542;--card:#fffdf7;--red:#c1121f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%}
body{color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));min-height:100vh;
background:radial-gradient(ellipse at 50% -10%,#2a9a6240,transparent 60%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><text x='12' y='46' font-size='30' fill='white' fill-opacity='.05'>♠</text><text x='78' y='46' font-size='30' fill='white' fill-opacity='.05'>♥</text><text x='12' y='116' font-size='30' fill='white' fill-opacity='.05'>♦</text><text x='78' y='116' font-size='30' fill='white' fill-opacity='.05'>♣</text></svg>"),radial-gradient(ellipse at center,#0d2a1d,#040b07 85%) fixed}
h1{margin:0 0 4px;font-size:24px}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.logo{font-family:Georgia,"Times New Roman",serif;font-size:44px;font-weight:900;letter-spacing:4px;line-height:1.1;background:linear-gradient(180deg,#fff0a8,#f5c542 50%,#b9810f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a3b00) drop-shadow(0 6px 10px #000a)}
.logo.sm{font-size:26px;margin-bottom:6px}.suits{display:flex;justify-content:center;gap:12px;font-size:20px;margin:2px 0 12px;color:#fff}.suits .r{color:#ff6b6b}
.hero{display:flex;justify-content:center;height:112px;margin:2px 0 8px}
.hero .card{margin:0 -13px;transform-origin:50% 130%;animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -7px}}
.panel{background:linear-gradient(160deg,#ffffff1c,#00000050);border:1px solid #f5c54240;border-radius:20px;padding:18px 16px;max-width:480px;margin:5vh auto 0;text-align:center;box-shadow:0 14px 44px #000b,inset 0 1px 0 #ffffff26;backdrop-filter:blur(6px)}
input{font-size:18px;text-transform:uppercase;letter-spacing:4px;text-align:center;padding:12px;border-radius:12px;border:2px solid #f5c54255;background:#06140eaa;color:#fff;width:100%;margin:8px 0;outline:none}
input:focus{border-color:var(--gold);box-shadow:0 0 12px #f5c54266}input::placeholder{color:#7fa690}
button{font:inherit;font-weight:800;letter-spacing:.3px;font-size:16px;padding:12px 20px;border:0;border-radius:12px;background:linear-gradient(180deg,#ffd75e,#e8a91c);color:#3a2600;box-shadow:0 4px 0 #8a5a00,0 8px 16px #0006;cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a00,0 3px 8px #0006}
button.sec{background:linear-gradient(180deg,#ffffff2e,#ffffff10);color:#fff;box-shadow:0 3px 0 #0007,inset 0 0 0 1px #ffffff30}
button:disabled{opacity:.4}
#snd{position:fixed;top:max(8px,env(safe-area-inset-top));right:10px;z-index:99;width:40px;height:40px;padding:0;font-size:18px;border-radius:50%;background:#000a;color:#fff;box-shadow:inset 0 0 0 1px #ffffff40}
.seat{display:flex;align-items:center;gap:12px;padding:8px 12px;margin:6px 0;border-radius:14px;background:linear-gradient(90deg,#ffffff18,#ffffff06);border:1px solid #ffffff1c;text-align:left;font-size:16px}
.seat .big,.opp .av,.me .av{display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffffff55,#ffffff12);box-shadow:0 0 0 2px #ffffff45}
.seat .big{width:44px;height:44px;font-size:28px;box-shadow:0 0 0 2px var(--gold)}
.avs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0 14px}
.avs button{width:48px;height:48px;padding:0;font-size:28px;border-radius:50%;background:#ffffff18;box-shadow:inset 0 0 0 1px #ffffff25;color:inherit}
.avs button:active{transform:scale(.9)}.avs button.mine{background:linear-gradient(180deg,#ffd75e,#e8a91c);box-shadow:0 0 14px var(--gold)}.avs button.taken{opacity:.25}
.code{display:inline-block;font-size:34px;letter-spacing:8px;font-weight:900;padding:4px 10px 4px 18px;border:2px dashed #f5c54299;border-radius:12px;background:#0007;color:var(--gold)}
.err{color:#ffb4a8;min-height:20px;font-size:14px;text-align:center}
.table{position:relative;max-width:760px;margin:0 auto;border-radius:34px;padding:14px;background:radial-gradient(ellipse at 50% 40%,#22a463 0%,var(--felt) 38%,var(--felt2) 100%);box-shadow:0 0 0 6px #5a3b1e,0 0 0 9px #9a6a30,0 0 0 11px #2e1a08,0 20px 44px #000c,inset 0 0 70px #000b,inset 0 0 0 2px #f5c54238}
.table::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-radial-gradient(circle at 20% 30%,#ffffff07 0 1px,transparent 1px 3px);pointer-events:none}
.table>*{position:relative}
.top{display:flex;flex-wrap:wrap;gap:8px}
.opp{flex:1 1 84px;min-width:0;text-align:center;padding:6px 4px 4px;border-radius:16px;background:linear-gradient(180deg,#00000070,#00000035);font-size:13px;border:2px solid #ffffff18;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.opp .av{width:40px;height:40px;margin:0 auto 2px;font-size:24px}
.opp.turn .av,.me.turn .av{box-shadow:0 0 0 3px var(--gold),0 0 16px var(--gold)}
.opp .cnt{display:inline-block;background:#000a;border-radius:99px;padding:1px 9px;font-size:12px;margin-top:2px}
.turn{border-color:var(--gold)!important;box-shadow:0 0 18px #f5c54299;animation:glow 1.3s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 8px #f5c54255}to{box-shadow:0 0 22px #f5c542cc}}
.fan{display:flex;justify-content:center;margin-top:5px;height:28px}
.back{width:20px;height:28px;border-radius:4px;margin-left:-12px;background:repeating-linear-gradient(45deg,#8e1b2c 0 3px,#b8283c 3px 6px);border:2px solid #fff;box-shadow:0 1px 3px #0009}
.center{min-height:112px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;padding:6px;border-radius:50%/42%;background:radial-gradient(ellipse at center,#00000038,transparent 72%);border:2px dashed #f5c54230}
.center.dense{gap:0}.center.dense>div{margin-left:-26px}.center.dense>div:first-child{margin-left:0}.center.dense .who{display:none}
.center>div:nth-child(odd) .card{rotate:-3deg}.center>div:nth-child(even) .card{rotate:3deg}
.msg{text-align:center;font-size:15px;min-height:22px;margin:5px 0;text-shadow:0 1px 2px #0008}
.pill{display:inline-block;padding:6px 18px;border-radius:99px;background:#0008;border:1px solid #ffffff2a;font-weight:800}
.pill.mine{background:linear-gradient(180deg,#ffd75e,#e8a91c);color:#3a2600;border-color:#fff8;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.card{position:relative;width:52px;height:76px;background:linear-gradient(160deg,#fff,#f1ecde);color:#111;border:1px solid #b9b3a1;border-radius:9px;box-shadow:0 3px 8px #0009,inset 0 0 0 2px #ffffffb0;display:inline-flex;flex-direction:column;align-items:flex-start;padding:4px 5px;font-weight:800;font-size:19px;line-height:1;flex:none;user-select:none}
.card.r{color:var(--red)}
.card .i{display:flex;flex-direction:column;align-items:center;gap:2px}.card .rk{font-size:1em;line-height:1}.card .st{font-size:.9em;line-height:1}
.card .c{margin:auto;font-size:1.9em;line-height:1;text-shadow:0 2px 3px #0003}
.card.a .c{font-size:2.5em}.card.f .c{font-size:1.5em;border:2px solid currentColor;border-radius:7px;padding:4px 7px;background:#00000008}
.pl{animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}@keyframes pop{from{transform:translateY(-70px) rotate(-14deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.who{display:block;text-align:center;font-size:11px;color:#e3f6ea;margin-top:4px;text-shadow:0 1px 2px #000}
.me{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px;border-radius:14px;border:2px solid transparent;margin-top:6px;font-size:15px;font-weight:700}
.me .av{width:40px;height:40px;font-size:26px}
.hand{margin-top:4px;border-radius:16px;padding:6px 4px 2px;background:linear-gradient(180deg,#00000060,#00000026);border:1px solid #ffffff1c;box-shadow:inset 0 2px 10px #0008}
.hrow{display:flex;align-items:flex-start;justify-content:center;gap:6px}
.hs{width:26px;height:26px;line-height:26px;border-radius:50%;background:#ffffff1c;text-align:center;font-size:17px;color:#fff;margin-top:8px}.hs.r{color:#ff7b7b}.hs:empty{background:none}
.hr{position:relative}
.hr .card{position:absolute;width:var(--cw);height:var(--ch);font-size:var(--fs);padding:3px 3px 2px 5px;transition:top .12s,filter .12s;box-shadow:-3px 0 6px #0008}
.hr .card .rk{font-size:1.1em}.hr .card .st{font-size:1em}.hr .card .c{font-size:calc(var(--cw)*.62)}
.hr .card.ok{outline:2px solid var(--gold);cursor:pointer}.hr .card.no{filter:brightness(.55)}
.hr .card.sel{outline:3px solid #fff;box-shadow:0 0 18px var(--gold),0 6px 14px #000a}
.deal .card{animation:deal .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n,0)*35ms)}
@keyframes deal{from{transform:translateY(-130px) rotate(-22deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
.bar{display:flex;justify-content:center;align-items:center;gap:10px;margin:4px 0 2px;min-height:40px;flex-wrap:wrap}
.hint{color:#e7f5ec;font-size:14px;text-align:center}
.log{font-size:12px;color:var(--mut);text-align:center;margin-top:10px}
.win{font-size:26px;font-weight:900;color:var(--gold);text-align:center;margin:8px 0;text-shadow:0 2px 0 #5a3b00,0 0 18px #f5c54288}
.trophy{display:inline-block;animation:bounce .8s ease-in-out infinite alternate}@keyframes bounce{to{transform:translateY(-8px) rotate(8deg)}}
.donk .don{display:inline-block;animation:wob 1s ease-in-out infinite}@keyframes wob{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:98}
.rain span{position:absolute;top:-40px;animation:fall linear forwards}@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
/* progressively tighter table when the screen is short, so nobody has to scroll */
.table+.err{min-height:0}
.c1 .log,.c2 .log,.c3 .log{display:none}.c1 .center{min-height:92px;margin:4px 0}
.c2 .opp .av{width:32px;height:32px;font-size:20px}.c2 .fan{display:none}.c2 .center{min-height:70px}.c2 .center .card{width:40px;height:58px;font-size:14px}
.c3 .table,.table.c3{padding:8px}.c3 .msg{margin:2px 0;min-height:0}.c3 .me .av{width:28px;height:28px;font-size:18px}.c3 .center{min-height:56px;margin:2px 0}.c3 .center .card{width:34px;height:50px;font-size:12px}.c3 .who{display:none}.c3 .opp .cnt{margin-top:0}
@media(min-width:520px){.card{width:60px;height:88px;font-size:22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<button id="snd" aria-label="Sound on/off">🔊</button>
<div id="app"></div>
<script>
const SU=['♠','♣','♦','♥'],RN={11:'J',12:'Q',13:'K',14:'A'},su=c=>Math.floor(c/13),rk=c=>c%13+2,rl=r=>RN[r]||r;
const AV=['🦁','🐯','🐼','🦊','🐸','🐵','🦄','🐶','🐱','🐙','🦉','🐢','🐧','🐘','🦖','🐰'];
const $=document.getElementById('app'),esc=t=>String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let ws,S=null,uname='',err='',room='',pid='',avatar='',sel=null,animHand=false,prevTL=0,lvl=0,tableMode=false;
try{room=localStorage.getItem('dk_room')||'';uname=localStorage.getItem('dk_name')||'';avatar=localStorage.getItem('dk_av')||'';pid=localStorage.getItem('dk_pid')||'';if(!pid){pid=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('dk_pid',pid)}}catch(e){pid=pid||Math.random().toString(36).slice(2)+Date.now().toString(36)}

/* ---- sounds: all tones are generated in the browser (no audio files, no copyright) ---- */
let AC=null,mute=false;try{mute=localStorage.getItem('dk_mute')==='1'}catch(e){}
function unlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
function tone(f,t,d,type,vol){const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type=type;o.frequency.value=f;o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.start(s);o.stop(s+d+.05)}
function seq(notes,step,type,vol){let t=0;notes.forEach(n=>{tone(n[0],t,n[1]*step,type,vol);t+=n[1]*step});return t}
function sfx(kind){if(mute||!AC)return;try{
  if(kind==='start'){seq([[523.25,1],[659.25,1],[783.99,1],[659.25,1],[783.99,1],[1046.5,2],[783.99,1],[1046.5,1],[1318.5,3]],.13,'triangle',.2)}
  else if(kind==='win'){const e=seq([[392,1],[523.25,1],[659.25,1],[783.99,2],[659.25,1],[783.99,1],[1046.5,3]],.16,'square',.1);[523.25,659.25,783.99,1046.5].forEach(f=>tone(f,e,1.1,'triangle',.12))}
  else if(kind==='sad'){seq([[329.63,2],[311.13,2],[293.66,2],[261.63,5]],.22,'sawtooth',.08)}
}catch(e){}}
const sb=document.getElementById('snd');sb.textContent=mute?'🔇':'🔊';
sb.onclick=()=>{mute=!mute;sb.textContent=mute?'🔇':'🔊';try{localStorage.setItem('dk_mute',mute?'1':'0')}catch(e){}if(!mute){unlock();sfx('start')}};
function rain(list){try{const d=document.createElement('div');d.className='rain';for(let i=0;i<36;i++){const s=document.createElement('span');s.textContent=list[i%list.length];s.style.cssText=`left:${Math.random()*100}%;animation-duration:${2.5+Math.random()*2.5}s;animation-delay:${Math.random()*1.2}s;font-size:${18+Math.random()*22}px`;d.appendChild(s)}document.body.appendChild(d);setTimeout(()=>d.remove(),6500)}catch(e){}}
const HERO='<div class="hero">'+[[12,-24],[25,-8],[38,8],[51,24]].map((x,i)=>card(x[0],'','style="rotate:'+x[1]+'deg;animation-delay:'+i*.25+'s"')).join('')+'</div>';
const LOGO='<div class="logo">DONKEY</div><div class="suits"><span>♠</span><span class="r">♥</span><span>♣</span><span class="r">♦</span></div>';
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});

function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{if(room&&uname&&S)join();draw()};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.type==='state'){const pg=S&&S.game,ng=m.game;
      if(ng&&ng.first&&(!pg||pg.winner>=0)){animHand=true;sfx('start')}
      if(ng&&ng.winner>=0&&(!pg||pg.winner<0)){const lo=m.players.map((_,i)=>i).sort((a,b)=>ng.counts[b]-ng.counts[a])[0];const sad=m.me===lo&&m.me!==ng.winner;sfx(sad?'sad':'win');rain(sad?['🫏']:['🎉','✨','⭐','🃏','♠','♥','♦','♣'])}
      S=m;err='';if(m.players[m.me]&&m.players[m.me].avatar){avatar=m.players[m.me].avatar;try{localStorage.setItem('dk_av',avatar)}catch(e){}}}
    else if(m.type==='error'){err=m.text;if(m.left)S=null}
    draw()};
  ws.onclose=()=>setTimeout(connect,1500);
}
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function join(){send({type:'join',code:room,name:uname,pid,avatar})}

function card(c,cls,x){const s=SU[su(c)],r=rl(rk(c));return `<div class="card ${su(c)>1?'r':''} ${rk(c)>=11&&rk(c)<=13?'f':rk(c)===14?'a':''} ${cls||''}" ${x||''}><div class="i"><span class="rk">${r}</span><span class="st">${s}</span></div><div class="c">${s}</div></div>`}
function plan(n){return n===2?'2 players: 13 cards each (half a deck, picked at random)':n===3?'3 players: 13 cards each (3/4 of a deck, picked at random)':n===4?'4 players: two decks, 26 cards each':n===5?'5 players: two decks, 20 cards each (4 cards set aside)':''}

/* Hand: cards grouped in one row per suit, highest rank first. Tap a highlighted card to select it, then press Play. */
function handHTML(hand,myTurn,ok){
  const k0=[1,.92,.85,.78,.72,.66,.62][lvl],vw=Math.min(window.innerWidth,760),cw=Math.round((vw>520?66:52)*k0),ch=Math.round(cw*1.45),fs=Math.max(12,Math.round(cw*.43)),pitch=Math.round(ch*.74);
  const W=Math.max(200,vw-92),minStep=cw*.55,per=Math.max(1,Math.floor((W-cw)/minStep)+1),seen={};let idx=0;
  const rows=[];
  for(let s=0;s<4;s++){const cs=hand.filter(c=>su(c)===s).sort((a,b)=>rk(b)-rk(a));for(let i=0;i<cs.length;i+=per)rows.push({s,first:i===0,row:cs.slice(i,i+per)})}
  let h=`<div class="hand ${animHand?'deal':''}" style="--cw:${cw}px;--ch:${ch}px;--fs:${fs}px">`;
  rows.forEach((r,ri)=>{
    const row=r.row,step=row.length>1?Math.min(cw*.85,(W-cw)/(row.length-1)):0,w=cw+step*(row.length-1),last=ri===rows.length-1;
    let cards='',hasSel=false;
    row.forEach((c,k)=>{
      seen[c]=(seen[c]||0)+1;const key=c+'-'+seen[c],can=myTurn&&ok.has(c),isSel=sel===key;if(isSel)hasSel=true;
      cards+=card(c,(can?'ok ':myTurn?'no ':'')+(isSel?'sel':''),`data-c="${c}" data-k="${key}" style="left:${k*step}px;top:${isSel?0:can?4:8}px;z-index:${isSel?60:k};--n:${idx++}"`);
    });
    h+=`<div class="hrow"><span class="hs ${r.s>1?'r':''}">${r.first?SU[r.s]:''}</span><div class="hr" style="width:${w}px;height:${last?ch+8:pitch}px;z-index:${hasSel?100:ri+1}">${cards}</div></div>`;
  });
  return h+'</div>';
}

function render(){
  if(!S){$.innerHTML=`<div class="panel">${HERO}${LOGO}<div class="sub">2–5 player card game (play alone against bots too). Pick a name, then create a room code and share it with friends, or enter the code they gave you.</div>
    <input id="nm" maxlength="14" placeholder="Your name" value="${esc(uname)}" style="text-transform:none;letter-spacing:0">
    <input id="rc" maxlength="6" placeholder="ROOM CODE" value="${esc(room)}"><button id="jb">Join / Create room</button>
    <div style="margin-top:10px"><button id="rnd" class="sec">Make a random code</button></div><div class="err">${esc(err)}</div></div>`;
    document.getElementById('rnd').onclick=()=>{document.getElementById('rc').value=Math.random().toString(36).slice(2,6).toUpperCase()};
    document.getElementById('jb').onclick=()=>{uname=document.getElementById('nm').value.trim();room=document.getElementById('rc').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(!uname||!room){err='Enter your name and a room code.';return draw()}
      try{localStorage.setItem('dk_room',room);localStorage.setItem('dk_name',uname)}catch(e){}join()};return}
  if(!S.game){const n=S.players.length,mine=S.players[S.me]?S.players[S.me].avatar:'';
    let h=`<div class="panel"><div class="logo sm">DONKEY</div><div class="sub">Room code (share it with friends)</div><div class="code">${esc(S.room)}</div><div class="sub">${n}/5 players seated</div>`;
    S.players.forEach((p,i)=>h+=`<div class="seat"><span class="big">${p.avatar||'🙂'}</span><span>${esc(p.name)}${i===S.me?' (you)':''}${p.bot?' (bot)':''}${p.online?'':' (offline)'}</span></div>`);
    h+='<div class="sub" style="margin-top:12px">Choose your avatar (you can change it until the game starts)</div><div class="avs">';
    AV.forEach(a=>{const taken=S.players.some((p,i)=>i!==S.me&&p.avatar===a);h+=`<button data-a="${a}" class="${a===mine?'mine':''} ${taken?'taken':''}" ${taken?'disabled':''}>${a}</button>`});
    h+='</div>';
    const hasBot=S.players.some(p=>p.bot);
    h+=`<div style="margin:4px 0">${n<5?'<button id="ab" class="sec">🤖 Add bot</button> ':''}${hasBot?'<button id="rb" class="sec">Remove bot</button>':''}</div><div class="sub">Playing alone? Add a bot. Bots are easy level and play random legal cards.</div>`;
    h+=n<2?'<p class="sub">Waiting for another player or a bot…</p>':`<p class="sub">${plan(n)}${n<5?'<br>More friends can still join before you deal.':''}</p><button id="st">Deal the cards (${n} players)</button>`;
    $.innerHTML=h+`<div class="err">${esc(err)}</div></div>`;
    $.querySelectorAll('.avs button').forEach(b=>b.onclick=()=>send({type:'avatar',a:b.dataset.a}));
    const ab=document.getElementById('ab');if(ab)ab.onclick=()=>send({type:'addbot'});
    const rb=document.getElementById('rb');if(rb)rb.onclick=()=>send({type:'rmbot'});
    const b=document.getElementById('st');if(b)b.onclick=()=>send({type:'start'});return}
  const g=S.game,me=S.me,N=S.players.length,my=g.turn===me&&g.winner<0,P=S.players,av=i=>P[i].avatar||'🙂';
  const ok=new Set(g.ok);tableMode=true;
  if(sel!==null){const c=parseInt(sel,10);if(!my||!ok.has(c)||!g.hand.includes(c))sel=null}
  const opp=i=>`<div class="opp ${g.turn===i&&g.winner<0?'turn':''}"><div class="av">${av(i)}</div><b>${esc(P[i].name)}</b>${P[i].online?'':' ⚠'}<div class="cnt">${g.counts[i]} card${g.counts[i]==1?'':'s'}</div><div class="fan">${'<div class="back"></div>'.repeat(Math.min(g.counts[i],8))}</div></div>`;
  let h=`<div class="table c${lvl>=5?3:lvl>=3?2:lvl>=1?1:0}"><div class="top">${[...Array(N-1).keys()].map(k=>opp((me+1+k)%N)).join('')}</div><div class="center${(g.trick.length||g.last.length)>6?' dense':''}">`;
  if(g.trick.length)g.trick.forEach((t,ti)=>h+=`<div>${card(t.c,ti>=prevTL?'pl':'')}<span class="who">${av(t.p)} ${esc(P[t.p].name)}${t.off?' (no suit)':''}</span></div>`);
  else g.last.forEach(t=>h+=`<div style="opacity:.6">${card(t.c)}<span class="who">${av(t.p)} ${esc(P[t.p].name)}${t.off?' (no suit)':''}</span></div>`);
  prevTL=g.trick.length;
  h+='</div>';
  if(g.winner>=0){const lo=P.map((_,i)=>i).sort((a,b)=>g.counts[b]-g.counts[a])[0];
    h+=`<div class="win"><span class="trophy">🏆</span> ${av(g.winner)} ${esc(P[g.winner].name)} finished first!</div><div class="msg donk"><span class="don">🫏</span> ${av(lo)} ${esc(P[lo].name)} is the Donkey (${g.counts[lo]} cards left)</div><div style="text-align:center"><button id="ag">Play again</button></div>`}
  else h+=`<div class="msg">${esc(g.msg)}</div><div class="msg"><span class="pill ${my?'mine':''}">${my?'👉 Your turn':av(g.turn)+' '+esc(P[g.turn].name)+'’s turn'}</span></div>`;
  h+=`<div class="me ${my?'turn':''}"><span class="av">${av(me)}</span><span>${esc(P[me].name)} (you) · ${g.hand.length} cards</span></div>`;
  if(g.winner<0){
    if(my&&sel!==null){const c=parseInt(sel,10);h+=`<div class="bar"><button id="pl">Play ${rl(rk(c))}${SU[su(c)]}</button><button id="cx" class="sec">Cancel</button></div>`}
    else if(my)h+=`<div class="bar"><div class="hint">${g.trick.length&&!g.hand.some(c=>su(c)===g.lead)?`No ${SU[g.lead]}? Tap any card. ${av(g.trick.slice().sort((a,b)=>rk(b.c)-rk(a.c))[0].p)} ${esc(P[g.trick.slice().sort((a,b)=>rk(b.c)-rk(a.c))[0].p].name)} (highest so far) will pick up all the cards on the table.`:'Tap a glowing card, then press Play.'}</div></div>`;
    else h+='<div class="bar"><div class="hint">Waiting for '+esc(P[g.turn].name)+'…</div></div>';
  }
  h+=handHTML(g.hand,my,ok);
  $.innerHTML=h+`</div><div class="err">${esc(err)}</div><div class="log">Follow the lead suit if you can. When everyone has played a card of the same suit, the round ends, those cards are set aside and the highest card leads next. If someone has no card of that suit, they play any card and the player with the highest card of that suit in the round picks up all the cards on the table.</div>`;
  $.querySelectorAll('.card.ok').forEach(e=>e.onclick=()=>{sel=sel===e.dataset.k?null:e.dataset.k;draw()});
  const pl=document.getElementById('pl');if(pl)pl.onclick=()=>{const c=parseInt(sel,10);sel=null;send({type:'play',card:c})};
  const cx=document.getElementById('cx');if(cx)cx.onclick=()=>{sel=null;draw()};
  const a=document.getElementById('ag');if(a)a.onclick=()=>send({type:'again'});
}
function fits(){try{return $.getBoundingClientRect().bottom+(window.scrollY||0)+14<=window.innerHeight}catch(e){return true}}
/* Draw the table; if it is taller than the screen, shrink cards and spacing step by step until it fits (no scrolling). */
function draw(){
  const a=animHand,p=prevTL;lvl=0;
  for(;;){animHand=a;prevTL=p;tableMode=false;render();if(!tableMode||lvl>=6||fits())break;lvl++}
  animHand=false;
}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(draw,150)});
connect();draw();
</script></body></html>
