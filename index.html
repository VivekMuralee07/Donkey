<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1d16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="icon" href="/icon.svg">
<title>Donkey</title>
<style>
:root{--bg:#0b1d16;--felt:#14683f;--felt2:#0c4a2c;--ink:#f4f1e8;--mut:#a9c4b5;--gold:#f5c542;--card:#fffdf7;--red:#d1242f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at top,var(--felt2),var(--bg) 70%) fixed;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));min-height:100vh}
h1{margin:0 0 4px;font-size:24px}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.panel{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px;max-width:480px;margin:8vh auto 0;text-align:center}
input{font-size:18px;text-transform:uppercase;letter-spacing:4px;text-align:center;padding:10px;border-radius:10px;border:1px solid #888;width:100%;margin:10px 0}
button{font-size:16px;font-weight:700;padding:11px 18px;border:0;border-radius:10px;background:var(--gold);color:#2a2000}
button:disabled{opacity:.45}.seat{padding:8px;margin:6px 0;border-radius:10px;background:rgba(255,255,255,.08)}
.err{color:#ffb4a8;min-height:20px;font-size:14px}
.table{max-width:760px;margin:0 auto;background:radial-gradient(ellipse at center,var(--felt),var(--felt2));border:6px solid #5a3b1e;border-radius:26px;padding:12px;box-shadow:inset 0 0 40px #0007,0 8px 24px #0006}
.top{display:flex;gap:8px}.opp{flex:1;text-align:center;padding:8px;border-radius:12px;background:#0004;font-size:14px;border:2px solid transparent}
.turn{border-color:var(--gold)!important;box-shadow:0 0 14px var(--gold)}
.fan{display:flex;justify-content:center;margin-top:6px;height:34px}
.back{width:24px;height:34px;border-radius:4px;margin-left:-14px;background:repeating-linear-gradient(45deg,#7b1e2b,#7b1e2b 4px,#a12a3a 4px,#a12a3a 8px);border:1px solid #fff}
.center{min-height:150px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.msg{text-align:center;font-size:15px;min-height:22px;margin:4px 0}
.card{width:58px;height:84px;background:var(--card);color:#1a1a1a;border-radius:8px;box-shadow:0 2px 6px #0007;display:inline-flex;flex-direction:column;justify-content:space-between;padding:4px 5px;font-weight:700;font-size:16px;line-height:1;flex:none;user-select:none}
.card.r{color:var(--red)}.card .c{font-size:30px;text-align:center}.card .b{transform:rotate(180deg)}
.pl{animation:pop .35s ease-out}@keyframes pop{from{transform:translateY(-40px) scale(.7);opacity:0}to{transform:none;opacity:1}}
.who{display:block;text-align:center;font-size:11px;color:#d7efe0;margin-top:3px}
.hand{display:flex;flex-wrap:wrap;justify-content:center;padding:8px 14px 0}
.hand .card{margin-left:-20px;margin-bottom:6px;transition:transform .15s}
.hand .ok{outline:2px solid transparent}.hand .ok:active{transform:translateY(-14px);outline-color:var(--gold)}.hand .no{filter:brightness(.6)}
.me{text-align:center;padding:6px;border-radius:12px;border:2px solid transparent;margin-top:6px;font-size:14px}
.log{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}.win{font-size:26px;color:var(--gold);text-align:center;margin:8px 0}
@media(max-width:480px){.card{width:50px;height:74px;font-size:14px}.card .c{font-size:26px}.hand .card{margin-left:-24px}}
</style></head><body>
<div id="app"></div>
<script>
const SU=['♠','♣','♦','♥'],RN={11:'J',12:'Q',13:'K',14:'A'},su=c=>Math.floor(c/13),rk=c=>c%13+2,rl=r=>RN[r]||r;
const $=document.getElementById('app'),esc=t=>String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let ws,S=null,uname='',err='',room='',pid='';
try{room=localStorage.getItem('dk_room')||'';uname=localStorage.getItem('dk_name')||'';pid=localStorage.getItem('dk_pid')||'';if(!pid){pid=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('dk_pid',pid)}}catch(e){pid=pid||Math.random().toString(36).slice(2)+Date.now().toString(36)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});

function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{if(room&&uname&&S)join();draw()};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.type==='state'){S=m;err=''}
    else if(m.type==='error'){err=m.text;if(m.left)S=null}
    draw()};
  ws.onclose=()=>setTimeout(connect,1500);
}
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function join(){send({type:'join',code:room,name:uname,pid})}

function card(c,cls,x){const s=SU[su(c)],r=rl(rk(c));return `<div class="card ${su(c)>1?'r':''} ${cls||''}" ${x||''}><div>${r}<br>${s}</div><div class="c">${s}</div><div class="b">${r}<br>${s}</div></div>`}

function draw(){
  if(!S){$.innerHTML=`<div class="panel"><h1>♠ ♥ Donkey ♦ ♣</h1><div class="sub">3-player card game. Pick a name, then create a room code and share it with 2 friends, or enter the code they gave you.</div>
    <input id="nm" maxlength="14" placeholder="Your name" value="${esc(uname)}" style="text-transform:none;letter-spacing:0">
    <input id="rc" maxlength="6" placeholder="ROOM CODE" value="${esc(room)}"><button id="jb">Join / Create room</button>
    <div style="margin-top:10px"><button id="rnd" style="background:#fff3;color:#fff">Make a random code</button></div><div class="err">${esc(err)}</div></div>`;
    document.getElementById('rnd').onclick=()=>{document.getElementById('rc').value=Math.random().toString(36).slice(2,6).toUpperCase()};
    document.getElementById('jb').onclick=()=>{uname=document.getElementById('nm').value.trim();room=document.getElementById('rc').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(!uname||!room){err='Enter your name and a room code.';return draw()}
      try{localStorage.setItem('dk_room',room);localStorage.setItem('dk_name',uname)}catch(e){}join()};return}
  if(!S.game){let h=`<div class="panel"><h1>Room ${esc(S.room)}</h1><div class="sub">Share this room code with your friends (${S.players.length}/3 seated)</div>`;
    S.players.forEach(p=>h+=`<div class="seat">🃏 ${esc(p.name)}${p.online?'':' (offline)'}</div>`);
    h+=S.players.length<2?'<p class="sub">Waiting for more players…</p>':(S.players.length<3?'<p class="sub">Waiting for a 3rd player, or start now with 2.</p>':'')+`<button id="st">Deal the cards (${S.players.length} players)</button>`;
    $.innerHTML=h+`<div class="err">${esc(err)}</div></div>`;const b=document.getElementById('st');if(b)b.onclick=()=>send({type:'start'});return}
  const g=S.game,me=S.me,N=S.players.length,my=g.turn===me&&g.winner<0,P=S.players;
  const opp=i=>`<div class="opp ${g.turn===i&&g.winner<0?'turn':''}"><b>${esc(P[i].name)}</b>${P[i].online?'':' ⚠'}<br>${g.counts[i]} card${g.counts[i]==1?'':'s'}<div class="fan">${'<div class="back"></div>'.repeat(Math.min(g.counts[i],10))}</div></div>`;
  let h=`<div class="table"><div class="top">${[...Array(N-1).keys()].map(k=>opp((me+1+k)%N)).join('')}</div><div class="center">`;
  if(g.trick.length)g.trick.forEach(t=>h+=`<div>${card(t.c,'pl')}<span class="who">${esc(P[t.p].name)}${t.off?' (gave)':''}</span></div>`);
  else g.last.forEach(t=>h+=`<div style="opacity:.6">${card(t.c)}<span class="who">${esc(P[t.p].name)}${t.off?' (no suit)':''}</span></div>`);
  h+='</div>';
  if(g.winner>=0){const lo=P.map((_,i)=>i).sort((a,b)=>g.counts[b]-g.counts[a])[0];
    h+=`<div class="win">🏆 ${esc(P[g.winner].name)} finished first!</div><div class="msg">🫏 ${esc(P[lo].name)} is the Donkey (${g.counts[lo]} cards left)</div><div style="text-align:center"><button id="ag">Play again</button></div>`}
  else h+=`<div class="msg">${esc(g.msg)}</div><div class="msg"><b>${my?'👉 Your turn':esc(P[g.turn].name)+'’s turn'}</b></div>`;
  h+=`<div class="me ${my?'turn':''}">${esc(P[me].name)} (you) · ${g.hand.length} cards</div><div class="hand">`;
  const ok=new Set(g.ok),hand=g.hand.slice().sort((a,b)=>su(a)-su(b)||rk(b)-rk(a));
  hand.forEach(c=>h+=card(c,my&&ok.has(c)?'ok':'no',`data-c="${c}"`));
  h+='</div>';
  if(my&&g.trick.length&&!hand.some(c=>su(c)===g.lead))h+=`<div class="log">No ${SU[g.lead]}? Pick any card. ${esc(P[g.trick.slice().sort((a,b)=>rk(b.c)-rk(a.c))[0].p].name)} (highest card so far) will pick up all the cards on the table.</div>`;
  $.innerHTML=h+`</div><div class="err" style="text-align:center">${esc(err)}</div><div class="log">Follow the lead suit if you can. If everyone follows suit, the highest card leads next round. If someone has no card of that suit, the player with the highest card of that round picks up all cards on the table.</div>`;
  $.querySelectorAll('.card.ok').forEach(e=>e.onclick=()=>send({type:'play',card:+e.dataset.c}));
  const a=document.getElementById('ag');if(a)a.onclick=()=>send({type:'again'});
}
connect();draw();
</script></body></html>
